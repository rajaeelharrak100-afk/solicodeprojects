<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>

    <link rel="stylesheet" href="style-jeu.css">
</head>

<body>

    <div class="game">
        <h1>Guess the Number</h1>

        <p>Guess a number between 1 and 100</p>

        <input type="number" id="guessInput" placeholder="Enter a number">

        <button onclick="start()" id="guessButton">Guess</button>

        <p id="message"></p>

        <p id="attempts"></p>
    </div>

    <script src="script-jeu.js"></script>

</body>
</html>
